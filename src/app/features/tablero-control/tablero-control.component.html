<div class="h-auto min-h-[100dvh] bg-gray-50 dark:bg-gray-900 p-3 pb-24 flex flex-col overflow-y-auto md:h-screen md:min-h-0 md:p-4 md:pb-4 md:overflow-hidden">
  
  <!-- Header con título y fecha -->
  <div class="mb-3 md:mb-4 flex flex-shrink-0 items-start justify-between gap-3">
    <div>
      <div class="flex items-center gap-1.5">
        <h1 class="text-lg md:text-xl font-bold text-gray-800 dark:text-white">Tablero de Control</h1>
        <app-video-tutorial youtubeUrl="https://youtu.be/rQdQaUGxAYE" tooltip="Ver tutorial de Tablero de Control"></app-video-tutorial>
      </div>
      <p class="text-xs text-gray-500 dark:text-gray-400">{{ fechaActual | date:'d \'de\' MMMM \'del\' yyyy':'':'es' }}</p>
    </div>

    @if (metricaSeleccionada === 'gastos') {
      <div class="inline-flex shrink-0 rounded-xl border border-gray-200 bg-white p-1 shadow-sm dark:border-gray-700 dark:bg-gray-800"
           role="group" aria-label="Filtrar gastos por moneda">
        <button type="button"
                class="rounded-lg px-3 py-1.5 text-xs font-medium transition-colors"
                [class.bg-emerald-600]="monedaSeleccionada === 'TODAS'"
                [class.text-white]="monedaSeleccionada === 'TODAS'"
                [class.text-gray-600]="monedaSeleccionada !== 'TODAS'"
                [class.dark:text-gray-300]="monedaSeleccionada !== 'TODAS'"
                [attr.aria-pressed]="monedaSeleccionada === 'TODAS'"
                (click)="seleccionarMoneda('TODAS')">Todos</button>
      <button type="button"
              class="rounded-lg px-3 py-1.5 text-xs font-medium transition-colors"
              [class.bg-emerald-600]="monedaSeleccionada === 'PEN'"
              [class.text-white]="monedaSeleccionada === 'PEN'"
              [class.text-gray-600]="monedaSeleccionada !== 'PEN'"
              [class.dark:text-gray-300]="monedaSeleccionada !== 'PEN'"
              [attr.aria-pressed]="monedaSeleccionada === 'PEN'"
              (click)="seleccionarMoneda('PEN')">Soles</button>
      <button type="button"
              class="rounded-lg px-3 py-1.5 text-xs font-medium transition-colors"
              [class.bg-emerald-600]="monedaSeleccionada === 'USD'"
              [class.text-white]="monedaSeleccionada === 'USD'"
              [class.text-gray-600]="monedaSeleccionada !== 'USD'"
              [class.dark:text-gray-300]="monedaSeleccionada !== 'USD'"
              [attr.aria-pressed]="monedaSeleccionada === 'USD'"
              (click)="seleccionarMoneda('USD')">Dólares</button>
      </div>
    }
  </div>
  
  <!-- Layout principal - 2 columnas -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-3 flex-1 overflow-visible md:overflow-hidden">
    
    <!-- Columna izquierda - Métricas y Gráfico -->
    <div class="lg:col-span-4 flex flex-col gap-3 overflow-visible lg:overflow-auto">
      
      <!-- Componente de Métricas -->
      <app-metricas-card
        [proyectosFinalizados]="proyectosFinalizados"
        [proyectosActivos]="proyectosActivos"
        [gastosMes]="gastosMes"
        [gastosHoy]="gastosHoy"
        [gastosAyer]="gastosAyer"
        [gastosMesUSD]="gastosMesUSD"
        [gastosHoyUSD]="gastosHoyUSD"
        [gastosAyerUSD]="gastosAyerUSD"
        [moneda]="monedaSeleccionada"
        [metricaSeleccionada]="metricaSeleccionada"
        (metricaSeleccionadaChange)="seleccionarMetrica($event)">
      </app-metricas-card>
      
      <!-- Componente de Gráficos -->
      <app-graficos-card
        [tituloGrafico]="tituloGrafico"
        [tipoGrafico]="tipoGrafico"
        [datosGrafico]="datosGraficoActual"
        [datosPieChart]="datosPieChart"
        [compararMonedas]="compararMonedas"
        [datosComparativosBarras]="datosGastosComparativosBarras"
        [datosComparativosLineas]="datosGastosComparativosLineas"
        [datosComparativosPie]="datosGastosComparativosPie"
        [esGraficoGastos]="metricaSeleccionada === 'gastos'"
        [moneda]="monedaSeleccionada"
        [colorScheme]="compararMonedas ? colorSchemeMonedas : colorSchemeActual"
        [customColors]="customColors"
        [graficosListos]="graficosListos"
        (tipoGraficoChange)="cambiarTipoGrafico($event)"
        (selectGrafico)="onSelectGrafico($event)">
      </app-graficos-card>
    </div>
    
    <!-- Columna derecha - Contenedor flex para ambas tablas -->
    <div class="lg:col-span-8 flex flex-col gap-3 overflow-hidden">
    
    <!-- Componente Tabla de Proyectos -->
    <app-proyectos-tabla-card
      [proyectosFiltrados]="proyectosEnCursoFiltrados"
      [empresas]="empresasDisponibles"
      [empresaSeleccionada]="empresaSeleccionada"
      [metricaSeleccionada]="metricaSeleccionada"
      [mesSeleccionado]="mesSeleccionado"
      [proyectoSeleccionado]="proyectoSeleccionado"
      [tablaVisible]="tablaProyectosVisible"
      [lugares]="lugaresDisponibles"
      [areas]="areasDisponibles"
      [estadosDisponibles]="estadosFinalizadosDisponibles"
      [lugarSeleccionado]="lugarSeleccionado"
      [areaSeleccionada]="areaSeleccionada"
      [estadoProyecto]="estadoProyecto"
      [fechaDesde]="fechaDesde"
      [fechaHasta]="fechaHasta"
      [page]="paginacionProyectos.page"
      [size]="paginacionProyectos.size"
      [totalElements]="totalProyectos"
      [totalPages]="totalPaginasProyectos"
      [loading]="cargandoProyectos"
      [moneda]="monedaSeleccionada"
      (toggleTabla)="toggleTablaProyectos()"
      (limpiarFiltros)="limpiarFiltros()"
      (selectProyecto)="onSelectProyecto($event)"
      (empresaSeleccionadaChange)="onEmpresaChange($event)"
      (lugarSeleccionadoChange)="onLugarChange($event)"
      (areaSeleccionadaChange)="onAreaChange($event)"
      (estadoProyectoChange)="onEstadoProyectoChange($event)"
      (fechaDesdeChange)="onFechaDesdeChange($event)"
      (fechaHastaChange)="onFechaHastaChange($event)"
      (paginaAnterior)="cambiarPaginaProyectos(-1)"
      (paginaSiguiente)="cambiarPaginaProyectos(1)"
      (pageSizeChange)="cambiarTamanoProyectos($event)">
    </app-proyectos-tabla-card>
    
    <!-- Componente Tabla de Encargados/Gastos -->
    <app-encargados-tabla-card
      [metricaSeleccionada]="metricaSeleccionada"
      [tareasFiltradas]="tareasFiltradas"
      [gastosFiltrados]="gastosFiltrados"
      [proyectoSeleccionado]="proyectoSeleccionado"
      [categoriaSeleccionada]="categoriaSeleccionada"
      [tablaVisible]="tablaDetalleVisible"
      [modoVisualizacion]="modoVisualizacionTareas"
      [totalGastosFiltrados]="totalResumenGastos"
      [totalGastosFiltradosPen]="totalResumenGastosPen"
      [totalGastosFiltradosUsd]="totalResumenGastosUsd"
      [periodoGastos]="periodoGastos"
      [fechaDesdeGastos]="fechaDesdeGastos"
      [fechaHastaGastos]="fechaHastaGastos"
      [totalMateriales]="getTotalPorCategoria('Materiales')"
      [totalManoObra]="getTotalPorCategoria('Mano de Obra')"
      [totalOtrosCostos]="getTotalPorCategoria('Otros Costos')"
      [totalMaterialesUsd]="getTotalUsdPorCategoria('Materiales')"
      [totalManoObraUsd]="getTotalUsdPorCategoria('Mano de Obra')"
      [totalOtrosCostosUsd]="getTotalUsdPorCategoria('Otros Costos')"
      [page]="paginaDetalle.page"
      [size]="paginaDetalle.size"
      [totalElements]="totalDetalle"
      [totalPages]="totalPaginasDetalle"
      [loading]="cargandoDetalle"
      [moneda]="monedaSeleccionada"
      (toggleTabla)="toggleTablaDetalle()"
      (cambiarModo)="cambiarModoVisualizacionTareas($event)"
      (seleccionarCategoria)="seleccionarCategoria($event)"
      (periodoGastosChange)="cambiarPeriodoGastos($event)"
      (fechaDesdeGastosChange)="cambiarFechaDesdeGastos($event)"
      (fechaHastaGastosChange)="cambiarFechaHastaGastos($event)"
      (limpiarPeriodoPersonalizado)="limpiarPeriodoGastosPersonalizado()"
      (paginaAnterior)="cambiarPaginaDetalle(-1)"
      (paginaSiguiente)="cambiarPaginaDetalle(1)"
      (pageSizeChange)="cambiarTamanoDetalle($event)">
    </app-encargados-tabla-card>
    </div>
  </div>
</div>
